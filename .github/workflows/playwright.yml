name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python ML dependencies
      run: |
        cd backend/ml
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install Node dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Install Backend Node dependencies
      run: |
        cd backend
        npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Start all services in background
      run: |
        bash start.sh &
        
    - name: Wait for services to be ready
      run: |
        wait_for() {
          url="$1"
          name="$2"
          for i in $(seq 1 60); do
            if curl -sf "$url" > /dev/null; then
              echo "$name is ready"
              return 0
            fi
            sleep 2
          done
          echo "$name failed to start within 120s"
          return 1
        }
        wait_for "http://127.0.0.1:8000/health" "ML service"
        wait_for "http://127.0.0.1:3001/health" "Backend API"
        wait_for "http://127.0.0.1:5173" "Frontend"
      
    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
